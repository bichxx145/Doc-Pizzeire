<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc Pizza - Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --yellow: #ffd21f;
      --red: #e53935;
      --black: #070707;
      --dark: #151515;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: "Cairo", sans-serif;
      color: var(--white);
      background:
        linear-gradient(rgba(0,0,0,.86), rgba(0,0,0,.94)),
        url("https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=2000&q=90")
        center/cover fixed;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 5, 5, .94);
      border-bottom: 1px solid rgba(255, 210, 31, .3);
      backdrop-filter: blur(12px);
    }

    nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      direction: ltr;
      color: var(--yellow);
      font-family: "Montserrat", sans-serif;
      font-size: 20px;
      font-weight: 800;
    }

    .logo img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border: 2px solid var(--yellow);
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(255, 210, 31, .65);
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      font-weight: bold;
      transition: .3s;
    }

    .nav-links a:hover {
      color: var(--yellow);
    }

    .menu-btn {
      display: none;
      color: var(--yellow);
      background: none;
      border: none;
      font-size: 30px;
      cursor: pointer;
    }

    /* Hero */
    .hero {
      padding: 90px 0 70px;
      text-align: center;
    }

    .hero-logo {
      width: 145px;
      height: 145px;
      object-fit: cover;
      margin: 0 auto 25px;
      border: 4px solid var(--yellow);
      border-radius: 50%;
      box-shadow:
        0 0 20px var(--yellow),
        0 0 55px rgba(255, 210, 31, .35);
      animation: floating 3s ease-in-out infinite;
    }

    .hero h1 {
      color: var(--yellow);
      font-family: "Montserrat", sans-serif;
      font-size: clamp(38px, 7vw, 70px);
      direction: ltr;
      text-shadow: 0 0 18px rgba(255, 210, 31, .4);
    }

    .hero p {
      margin-top: 15px;
      color: #ddd;
      font-size: 18px;
    }

    /* Categories */
    .category {
      margin: 55px 0;
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: 13px;
      direction: ltr;
      margin-bottom: 24px;
      padding-bottom: 13px;
      border-bottom: 2px solid rgba(255, 210, 31, .45);
    }

    .category-title span {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      font-size: 28px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 18px rgba(255, 210, 31, .6);
    }

    .category-title h2 {
      color: var(--yellow);
      font-family: "Montserrat", sans-serif;
      font-size: 32px;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .food-card {
      position: relative;
      min-height: 350px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      cursor: pointer;
      background: var(--dark);
      border: 1px solid rgba(255, 210, 31, .25);
      border-radius: 20px;
      transition: .45s ease;
    }

    .food-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: var(--yellow);
      box-shadow:
        0 0 14px rgba(255, 210, 31, .8),
        0 0 42px rgba(255, 210, 31, .3),
        0 20px 45px rgba(0,0,0,.7);
    }

    .food-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.62) saturate(1.2);
      transition: .6s ease;
    }

    .food-card:hover .food-image {
      transform: scale(1.12);
      filter: brightness(.83) saturate(1.4);
    }

    .food-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,.98) 2%,
        rgba(0,0,0,.78) 38%,
        rgba(0,0,0,.05) 80%
      );
    }

    .food-info {
      position: relative;
      z-index: 2;
      padding: 22px;
    }

    .food-info h3 {
      color: var(--yellow);
      direction: ltr;
      text-align: left;
      font-family: "Montserrat", sans-serif;
      font-size: 20px;
      margin-bottom: 7px;
      text-shadow: 0 0 10px rgba(255, 210, 31, .65);
    }

    .food-info p {
      min-height: 50px;
      color: #eee;
      font-size: 14px;
      line-height: 1.8;
      text-shadow: 0 1px 4px #000;
    }

    .price {
      display: inline-block;
      margin-top: 13px;
      padding: 6px 14px;
      color: #111;
      background: var(--yellow);
      border-radius: 20px;
      direction: ltr;
      font-family: "Montserrat", sans-serif;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 0 13px rgba(255, 210, 31, .7);
    }

    .click-text {
      float: left;
      margin-top: 18px;
      color: #ccc;
      font-size: 11px;
    }

    /* Contact */
    .contact {
      margin-top: 70px;
      padding: 45px 20px;
      text-align: center;
      background: rgba(255,255,255,.06);
      border-top: 1px solid rgba(255,210,31,.25);
    }

    .contact h2 {
      color: var(--yellow);
      font-family: "Montserrat", sans-serif;
      direction: ltr;
      margin-bottom: 12px;
    }

    .contact p {
      color: #ddd;
      margin-bottom: 23px;
    }

    .contact-buttons {
      display: flex;
      justify-content: center;
      gap: 13px;
      flex-wrap: wrap;
    }

    .contact-buttons a {
      padding: 12px 22px;
      color: #111;
      background: var(--yellow);
      border-radius: 28px;
      font-weight: bold;
      transition: .3s;
    }

    .contact-buttons a:hover {
      transform: translateY(-5px);
      background: white;
      box-shadow: 0 0 18px rgba(255,255,255,.35);
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.82);
      backdrop-filter: blur(8px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      position: relative;
      width: min(480px, 100%);
      padding: 35px 25px;
      text-align: center;
      background: #171717;
      border: 2px solid var(--yellow);
      border-radius: 24px;
      box-shadow:
        0 0 20px rgba(255,210,31,.7),
        0 0 60px rgba(255,210,31,.25);
      animation: popup .35s ease;
    }

    .modal-icon {
      font-size: 60px;
      margin-bottom: 12px;
    }

    .modal-box h2 {
      color: var(--yellow);
      direction: ltr;
      font-family: "Montserrat", sans-serif;
      margin-bottom: 15px;
    }

    .modal-box p {
      color: #ddd;
      line-height: 2;
      margin-bottom: 18px;
    }

    .modal-price {
      display: inline-block;
      padding: 7px 18px;
      color: #111;
      background: var(--yellow);
      border-radius: 20px;
      direction: ltr;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .order-btn {
      display: block;
      padding: 12px;
      color: #111;
      background: var(--yellow);
      border-radius: 25px;
      font-weight: bold;
    }

    .close {
      position: absolute;
      top: 8px;
      left: 15px;
      color: white;
      background: none;
      border: none;
      font-size: 30px;
      cursor: pointer;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #aaa;
      background: #050505;
    }

    footer span {
      color: var(--yellow);
    }

    @keyframes floating {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes popup {
      from {
        opacity: 0;
        transform: scale(.8) translateY(30px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @media (max-width: 850px) {
      .food-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .menu-btn {
        display: block;
      }

      .nav-links {
        position: absolute;
        top: 78px;
        right: 0;
        left: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 25px;
        background: #080808;
      }

      .nav-links.active {
        display: flex;
      }
    }

    @media (max-width: 570px) {
      .food-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 60px;
      }

      .hero-logo {
        width: 125px;
        height: 125px;
      }

      .category-title h2 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <header>
    <div class="container">
      <nav>
        <a class="logo" href="#">
          <img src="Duck-ai-image-2026-10-02-07-38.jpeg" alt="Doc Pizza Logo">
          DOC PIZZA
        </a>

        <button class="menu-btn" id="menuBtn">☰</button>

        <ul class="nav-links" id="navLinks">
          <li><a href="#pizza">Pizza</a></li>
          <li><a href="#sandwich">Sandwich</a></li>
          <li><a href="#cheese">Cheese</a></li>
          <li><a href="#tacos">Tacos</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <img class="hero-logo" src="Duck-ai-image-2026-10-02-07-38.jpeg" alt="Doc Pizza">
      <h1>Notre MENU</h1>
      <p>اكتشف أشهى وجبات Doc Pizza</p>
    </div>
  </section>

  <main class="container" id="menu"></main>

  <!-- Contact -->
  <section class="contact">
    <div class="container">
      <h2>COMMANDER MAINTENANT</h2>
      <p>للطلب تواصل معنا عبر الهاتف أو إنستغرام</p>

      <div class="contact-buttons">
        <a href="tel:+213555555555">☎ 0783828659</a>
        <a href="tel:+213666666666">☎ 0656380005</a>
        <a href="https://www.instagram.com/doc.pizzaa?stkn=OHoxeWNidHB6amRw" target="_blank">
          ◎ @doc.pizza
        </a>
      </div>
    </div>
  </section>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="close" id="closeModal">×</button>

      <div class="modal-icon" id="modalIcon">🍕</div>
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
      <span class="modal-price" id="modalPrice"></span>

      <a class="order-btn" href="tel:+213555555555">
        اطلب الآن عبر الهاتف
      </a>
    </div>
  </div>

  <footer>
    © 2026 جميع الحقوق محفوظة لدى
    <span>Doc Pizza Pizzeria</span>
  </footer>

  <script>
    const menuData = [
      {
        id: "pizza",
        icon: "🍕",
        title: "Pizza",
        items: [
          ["Pizza Simple", "صلصة الطماطم، الجبن، الزيتون والأعشاب الإيطالية", "350 DA", "🍕", "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=900&q=90"],
          ["Pizza Poulet", "دجاج، جبن، فلفل، زيتون وصلصة الطماطم", "450 DA", "🍗", "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=900&q=90"],
          ["Pizza Thon", "تونة، جبن، زيتون، بصل وصلصة الطماطم", "500 DA", "🐟", "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=90"],
          ["Pizza Viande", "لحم مفروم، جبن، فلفل، زيتون وصلصة خاصة", "600 DA", "🥩", "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=90"],
          ["Pizza Poulet Fumé", "دجاج مدخن، جبن، فلفل وزيتون", "500 DA", "🍗", "https://imgs.search.brave.com/L_WbNDBSGLCZim5nMlM5u1A608i0K7AhyATlQf5KJYM/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/ZXVyaWFsZm9vZHNl/cnZpY2UtaW5kdXN0/cnkuZnIvd3AtY29u/dGVudC91cGxvYWRz/LzIwMjIvMDUvU1BJ/Q1ktUE9VTEVULTc2/OHg1NTkuanBn"],
          ["Pizza Champignons", "فطر، جبن، صلصة الطماطم والأعشاب", "550 DA", "🍄", "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=90"],
          ["Pizza 3 Fromages", "مزيج من ثلاثة أنواع من الجبن", "600 DA", "🧀", "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=90"],
          ["Pizza Végétarienne", "فلفل، زيتون، فطر، طماطم، بصل وجبن", "450 DA", "🥦", "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=90"],
          ["Pizza 2 Saisons", "اختيار مميز من مكونات متنوعة حسب الموسم", "600 DA", "🍕", "https://imgs.search.brave.com/jDD87oWjT5ElkZrWXgxvmQW_QjX59YAFg4iv7_TPaio/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/cGl6emEyYnVjaC1y/ZXN0YXVyYW50LWxh/dGVzdGVkZWJ1Y2gu/ZnIvbWVkaWEvY2Fj/aGUvcmVzb2x2ZS9s/NjAwL3dlYnNpdGVz/L2E3ODMwNTZkODI0/YjdiOTNhMjdhNTRl/ODBmYzE3YjM3L2lt/Zy9hY2N1ZWlsQl8y/MDI0MTEyOTE3NTkx/OS5qcGc"],
          ["Pizza 4 Saisons", "فطر، زيتون، فلفل، خضار وجبن", "850 DA", "🍕", "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=90"]
        ]
      },

      {
        id: "sandwich",
        icon: "🥪",
        title: "Sandwich",
        items: [
          ["Marine", "تونة، جبن، خس، طماطم وصلصة خاصة", "300 DA", "🥪", "https://images.unsplash.com/photo-1550507992-eb63ffee0847?auto=format&fit=crop&w=900&q=90"],
          ["Kebab", "كباب، جبن، بصل، طماطم وصوص خاص", "350 DA", "🥙", "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=900&q=90"],
          ["Viande Hachée", "لحم مفروم، جبن، خس، طماطم وصوص خاص", "400 DA", "🥪", "https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=900&q=90"],
          ["Escalope Hachée", "إسكالوب، جبن، بطاطا وصوص كريمي", "300 DA", "🥪", "https://images.unsplash.com/photo-1521305916504-4a1121188589?auto=format&fit=crop&w=900&q=90"]
        ]
      },

      {
        id: "cheese",
        icon: "🧀",
        title: "Cheese",
        items: [
          ["Cheese Poulet", "دجاج، جبن ذائب، بطاطا وصوص الجبن", "150 DA", "🧀", "https://images.unsplash.com/photo-1565299507177-b0ac66763828?auto=format&fit=crop&w=900&q=90"],
          ["Cheese Viande Hachée", "لحم مفروم، جبن ذائب، بطاطا وصوص خاص", "200 DA", "🧀", "https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=900&q=90"]
        ]
      },

      {
        id: "tacos",
        icon: "🌯",
        title: "Tacos",
        items: [
          ["Tacos Poulet", "دجاج، بطاطا، جبن وصوص ألغري", "350 DA", "🌯", "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=900&q=90"],
          ["Tacos Viande Hachée", "لحم مفروم، بطاطا، جبن وصوص خاص", "500 DA", "🌯", "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=900&q=90"],
          ["Tacos Foie", "كبدة، بطاطا، جبن وصوص خاص", "450 DA", "🌯", "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=900&q=90"],
          ["Tacos Merguez", "مرڨاز، بطاطا، جبن وصوص خاص", "400 DA", "🌯", "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=900&q=90"]
        ]
      }
    ];

    const menu = document.getElementById("menu");

    menuData.forEach(category => {
      const section = document.createElement("section");
      section.className = "category";
      section.id = category.id;

      section.innerHTML = `
        <div class="category-title">
          <span>${category.icon}</span>
          <h2>${category.title}</h2>
        </div>

        <div class="food-grid">
          ${category.items.map(item => `
            <article
              class="food-card"
              onclick="openFood(
                '${item[0]}',
                '${item[1]}',
                '${item[2]}',
                '${item[3]}'
              )"
            >
              <img class="food-image" src="${item[4]}" alt="${item[0]}">

              <div class="food-info">
                <h3>${item[0]}</h3>
                <p>${item[1]}</p>
                <span class="click-text">اضغط للتفاصيل</span>
                <span class="price">${item[2]}</span>
              </div>
            </article>
          `).join("")}
        </div>
      `;

      menu.appendChild(section);
    });

    // القائمة في الهاتف
    const menuBtn = document.getElementById("menuBtn");
    const navLinks = document.getElementById("navLinks");

    menuBtn.addEventListener("click", () => {
      navLinks.classList.toggle("active");
    });

    document.querySelectorAll(".nav-links a").forEach(link => {
      link.addEventListener("click", () => {
        navLinks.classList.remove("active");
      });
    });

    // نافذة تفاصيل الأكلة
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalDescription = document.getElementById("modalDescription");
    const modalPrice = document.getElementById("modalPrice");
    const modalIcon = document.getElementById("modalIcon");

    function openFood(title, description, price, icon) {
      modalTitle.textContent = title;
      modalDescription.textContent = description;
      modalPrice.textContent = price;
      modalIcon.textContent = icon;

      modal.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeFood() {
      modal.classList.remove("show");
      document.body.style.overflow = "auto";
    }

    document.getElementById("closeModal").addEventListener("click", closeFood);

    modal.addEventListener("click", event => {
      if (event.target === modal) {
        closeFood();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeFood();
      }
    });
  </script>

</body>
</html>
